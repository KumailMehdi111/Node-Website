version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: school_cms
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Uncomment below to run the backend in docker as well
  # backend:
  #   build: .
  #   ports:
  #     - "5000:5000"
  #   environment:
  #     - DATABASE_URL=postgresql://postgres:password@db:5432/school_cms?schema=public
  #     - JWT_SECRET=supersecret
  #     - JWT_REFRESH_SECRET=superrefreshsecret
  #     - PORT=5000
  #   depends_on:
  #     - db

volumes:
  postgres_data:
